# tmux-agent-mgr — options, keybindings and hooks.
#
# Sourced by tmux-agent-mgr.tmux, which resolves the binary first and exports it
# as @agent_mgr_bin. Set any option below in your own tmux.conf BEFORE loading
# the plugin; the `if -F` guards here only seed a value when you have not.
#
#   @agent_mgr_width       sidebar width in columns, or N% of the window (20%)
#   @agent_mgr_min_width   lower clamp on the resolved width (24)
#   @agent_mgr_max_width   upper clamp; unset means uncapped
#   @agent_mgr_position    which side the sidebar opens on: left | right (left)
#   @agent_mgr_agents_only list only panes running an agent (off)
#   @agent_mgr_tab_status  show a status glyph in window tabs (on)
#   @agent_mgr_nav         bind vim-aware C-h/C-j/C-k/C-l navigation (on)
#   @agent_mgr_key         prefix key that toggles the sidebar here (e)
#   @agent_mgr_key_all     prefix key that toggles it everywhere (E)
#   @agent_mgr_color_*     accent, session, working, blocked, idle, done, error,
#                          branch — a #RRGGBB hex or a 0-255 palette index
#
# The sidebar always excludes itself from its own list, so toggling it never
# changes what you are looking at.

# --- option defaults (only applied when unset) ---
if -F '#{==:#{@agent_mgr_width},}'        'set -g @agent_mgr_width 20%'
if -F '#{==:#{@agent_mgr_min_width},}'    'set -g @agent_mgr_min_width 24'
if -F '#{==:#{@agent_mgr_position},}'     'set -g @agent_mgr_position left'
if -F '#{==:#{@agent_mgr_agents_only},}'  'set -g @agent_mgr_agents_only off'
if -F '#{==:#{@agent_mgr_tab_status},}'   'set -g @agent_mgr_tab_status on'
if -F '#{==:#{@agent_mgr_nav},}'          'set -g @agent_mgr_nav on'
if -F '#{==:#{@agent_mgr_key},}'          'set -g @agent_mgr_key e'
if -F '#{==:#{@agent_mgr_key_all},}'      'set -g @agent_mgr_key_all E'

# --- keybindings ---
# The key names are read at load time, so changing @agent_mgr_key needs a config
# reload. The binding itself expands #{window_id} at press time.
run-shell 'key="$(tmux display-message -p "#{@agent_mgr_key}")"; \
  bin="$(tmux display-message -p "#{@agent_mgr_bin}")"; \
  tmux bind-key "$key" run-shell "\"$bin\" toggle \"##{window_id}\" \"##{pane_current_path}\""'
run-shell 'key="$(tmux display-message -p "#{@agent_mgr_key_all}")"; \
  bin="$(tmux display-message -p "#{@agent_mgr_bin}")"; \
  tmux bind-key "$key" run-shell "\"$bin\" toggle-all"'

# --- remove our own hooks first, so reloading the config cannot duplicate them ---
# tmux appends with -a and has no "replace this one hook" verb, so each reload
# would otherwise stack another copy and fire it N times.
run-shell 'tmux show-hooks -g after-select-pane   | awk "/@agent_mgr_pid/    { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/@agent_mgr_pid/    { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g pane-exited         | awk "/auto-close/        { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g window-resized      | awk "/agent_mgr_bin.*resize/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'

# --- instant refresh on focus change ---
# SIGUSR1 to every sidebar in the window that just changed focus. This is why the
# sidebar can poll slowly and still feel immediate: the interesting moments are
# pushed to it rather than discovered by polling.
set-hook -ga after-select-pane   "run-shell -b 'tmux list-panes -t \"#{window_id}\" -F \"#{@agent_mgr_pid}\" 2>/dev/null | while read -r pid; do [ -n \"\$pid\" ] && kill -USR1 \"\$pid\" 2>/dev/null; done; true'"
set-hook -ga after-select-window "run-shell -b 'tmux list-panes -t \"#{window_id}\" -F \"#{@agent_mgr_pid}\" 2>/dev/null | while read -r pid; do [ -n \"\$pid\" ] && kill -USR1 \"\$pid\" 2>/dev/null; done; true'"

# --- close a window left holding only the sidebar ---
# Without this, exiting the shell in your last real pane leaves an orphan sidebar
# instead of closing the window as tmux normally would.
set-hook -ga pane-exited 'run-shell "\"#{@agent_mgr_bin}\" auto-close \"#{window_id}\""'

# --- re-clamp the sidebar width after a window resize ---
# A percentage width has to be recomputed; tmux itself would just scale the pane.
set-hook -ga window-resized 'run-shell -b "\"#{@agent_mgr_bin}\" resize \"#{window_id}\""'

# --- window tab status glyph ---
# Appends a reference to the per-window option the daemon maintains, preserving
# whatever format you already had. Stripping first makes a reload idempotent.
if -F '#{!=:#{@agent_mgr_tab_status},off}' {
  run-shell 'for opt in window-status-format window-status-current-format; do \
    current="$(tmux show-option -gqv "$opt")"; \
    stripped="${current//\#\{@agent_mgr_window_icon\}/}"; \
    tmux set-option -gq "$opt" "${stripped}#{@agent_mgr_window_icon}"; \
  done'
} {
  run-shell 'for opt in window-status-format window-status-current-format; do \
    current="$(tmux show-option -gqv "$opt")"; \
    tmux set-option -gq "$opt" "${current//\#\{@agent_mgr_window_icon\}/}"; \
  done'
}

# --- vim-aware pane/session navigation ---
# C-h / C-l move between panes, wrapping to the previous/next window at an edge.
# C-j / C-k switch sessions. All four pass through to Vim when the focused pane is
# running it, so editor splits keep working.
if -F '#{!=:#{@agent_mgr_nav},off}' {
  run-shell 'is_vim="ps -o state= -o comm= -t \"#{pane_tty}\" | grep -iqE \"^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?\$\""; \
    tmux bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "if -F \"#{pane_at_left}\"  \"previous-window\" \"select-pane -L\""; \
    tmux bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "if -F \"#{pane_at_right}\" \"next-window\"     \"select-pane -R\""; \
    tmux bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "switch-client -n"; \
    tmux bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "switch-client -p"'
  # tree-mode binds C-j/C-k itself and would swallow them.
  run-shell 'tmux unbind-key -q -T tree-mode C-j 2>/dev/null; tmux unbind-key -q -T tree-mode C-k 2>/dev/null; true'
}
